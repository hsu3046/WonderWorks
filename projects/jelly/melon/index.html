<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>말랑한 수박 조각 · dani lab</title><meta name="theme-color" content="#f3f1e8"><link rel="icon" href="../assets/paint.webp"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../jelly-shared/native.css"><script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script></head><body><main id="lab">
<canvas id="scene" tabindex="0" aria-label="수박 젤리. 손 모드에서 잡아당기고, 칼 모드에서 선을 그어 자르세요."></canvas>
<header><a href="/" aria-label="dani 처음으로"><img src="../assets/dani-wordmark.png" alt="dani."></a><span class="edition">PLAY STUDIES / 003</span></header>
<div class="title"><span class="eyebrow">A LITTLE SLICE, A LITTLE WONDER</span><h1>말랑한<br>수박 조각<span>.</span></h1><p id="hint">손으로 잡아당기고, 놓아 보세요.<br>자른 조각도 하나씩 움직일 수 있습니다.</p></div>
<aside class="controls" aria-label="수박 조절"><div class="panel-title">손끝에 맞춰서</div><div class="tools"><button id="hand" aria-pressed="true">손으로 만지기</button><button id="knife" aria-pressed="false">칼로 자르기</button></div>
<fieldset class="flavors"><legend class="sr-only">과육 색</legend><button class="flavor watermelon" data-flavor="red" aria-label="빨간 수박" aria-pressed="true"></button><button class="flavor gold" data-flavor="gold" aria-label="노란 수박" aria-pressed="false"></button><button class="flavor pink" data-flavor="pink" aria-label="분홍 수박" aria-pressed="false"></button></fieldset>
<label for="firmness"><span>단단함</span><output id="firmness-value">말랑하게</output></label><input id="firmness" type="range" min="0" max="100" value="42"><label for="damping"><span>흔들림 가라앉기</span><output id="damping-value">천천히</output></label><input id="damping" type="range" min="0" max="100" value="35">
<button class="nudge" id="nudge">↟ 살짝 튕기기</button><div class="minor-actions"><button id="mesh" aria-pressed="false">구조 보기</button><button id="reset">처음으로 ↺</button></div></aside>
<div class="readout"><span class="live-dot"></span><div><small>수박 조각</small><strong id="pieces">1</strong></div><div><small>부피 유지</small><strong id="volume">100.0<span>%</span></strong></div><div><small>움직임</small><strong id="motion">0.00</strong></div></div>
<details id="technical"><summary>실험 정보</summary><p>XPBD · 실제 절단 단면 · 독립된 조각</p><p id="diagnostics"></p><p>절단은 세로 평면, 조각 충돌은 수평 윤곽 기반 근사입니다. 깊은 접힘의 자기 충돌은 미지원입니다.</p></details><p id="status" role="status">수박을 준비하고 있습니다.</p><p id="feedback" role="status" hidden></p>
</main><script type="module" src="demo.js"></script></body></html>
